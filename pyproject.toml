[project]
name = "deep-agents"
version = "0.1.0"
description = "LangGraph deep agents workspace"
requires-python = ">=3.14"
dependencies = [
    "black>=26.3.1",
    "deepagents>=0.5.7",
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.28.0",
    "isort>=8.0.1",
    "jsonpatch>=1.33",
    "langchain-anthropic>=1.4.3",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.3",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-nvidia-ai-endpoints>=1.3.0",
    "langchain-openai>=1.2.1",
    "langchain-tavily>=0.2.18",
    "langfuse>=4.5.1",
    "langgraph>=1.1.10",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.24",
    "truststore>=0.10.4",
]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
