<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      flex-shrink: 0;
    }
    header .icon { font-size: 1.6rem; }
    header h1   { font-size: 1.1rem; font-weight: 600; letter-spacing: .3px; }
    header p    { font-size: .75rem; opacity: .8; margin-left: auto; }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    /* ── Welcome placeholder ── */
    .welcome {
      margin: auto;
      text-align: center;
      color: #5f6368;
      user-select: none;
    }
    .welcome .hero { font-size: 3.5rem; display: block; margin-bottom: 8px; }
    .welcome h2    { font-size: 1.1rem; font-weight: 500; margin-bottom: 4px; }
    .welcome p     { font-size: .85rem; }

    /* ── Bubble base ── */
    .bubble {
      max-width: min(72%, 560px);
      padding: 10px 15px;
      border-radius: 18px;
      font-size: .93rem;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

    .bubble.user {
      align-self: flex-end;
      background: #1a73e8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: #fff;
      color: #202124;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .bubble.error {
      align-self: flex-start;
      background: #fce8e6;
      color: #c5221f;
      border-bottom-left-radius: 4px;
    }

    /* ── Status row ── */
    .status-row {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .8rem;
      color: #5f6368;
      padding: 2px 4px;
      animation: fadeIn .18s ease;
    }
    .status-row .spinner {
      width: 14px; height: 14px;
      border: 2px solid #c5cae9;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Typing dots (while waiting for first event) ── */
    .typing {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #bbb;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-5px); }
    }

    /* ── Input area ── */
    #input-area {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #user-input {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: .93rem;
      outline: none;
      transition: border-color .2s;
      resize: none;
      height: 42px;
      max-height: 120px;
      overflow-y: auto;
      font-family: inherit;
    }
    #user-input:focus { border-color: #1a73e8; }
    #send-btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 42px; height: 42px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    #send-btn:hover:not(:disabled) { background: #1558b0; }
    #send-btn:active:not(:disabled) { transform: scale(.93); }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <span class="icon">🌤</span>
  <h1>Weather Chatbot</h1>
  <p>Powered by Claude + OpenWeatherMap</p>
</header>

<div id="messages">
  <div class="welcome">
    <span class="hero">⛅</span>
    <h2>Ask me about the weather anywhere</h2>
    <p>Try: "What's the weather in Tokyo?" or "Is it warm in Barcelona?"</p>
  </div>
</div>

<div id="input-area">
  <textarea id="user-input" placeholder="Ask about the weather in any city…" rows="1"></textarea>
  <button id="send-btn" title="Send">&#9658;</button>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  const conversationHistory = [];

  function removeWelcome() {
    const w = messagesEl.querySelector('.welcome');
    if (w) w.remove();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(text, cls) {
    removeWelcome();
    const div = document.createElement('div');
    div.className = `bubble ${cls}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function addTyping() {
    removeWelcome();
    const div = document.createElement('div');
    div.className = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function addStatus(text) {
    const div = document.createElement('div');
    div.className = 'status-row';
    div.innerHTML = `<div class="spinner"></div><span>${text}</span>`;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function clearTransient() {
    messagesEl.querySelectorAll('.status-row, .typing').forEach(el => el.remove());
  }

  function setInputEnabled(on) {
    inputEl.disabled = !on;
    sendBtn.disabled = !on;
    if (on) inputEl.focus();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = '42px';
    setInputEnabled(false);

    addBubble(text, 'user');
    const typingEl = addTyping();

    let assistantBubble = null;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: conversationHistory }),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') continue;

          let msg;
          try { msg = JSON.parse(raw); } catch { continue; }

          if (msg.type === 'status') {
            typingEl.remove();           // remove typing dots on first event
            addStatus(msg.text);
          } else if (msg.type === 'response') {
            clearTransient();
            if (!assistantBubble) {
              assistantBubble = addBubble('', 'assistant');
            }
            assistantBubble.textContent = msg.text;
            scrollBottom();
          } else if (msg.type === 'error') {
            clearTransient();
            addBubble(`Error: ${msg.text}`, 'error');
          }
        }
      }

      // Fallback: if no response bubble was created
      if (!assistantBubble) {
        clearTransient();
        addBubble('Sorry, I did not receive a response. Please try again.', 'error');
      } else {
        conversationHistory.push({ role: 'user', content: text });
        conversationHistory.push({ role: 'assistant', content: assistantBubble.textContent });
      }

    } catch (err) {
      clearTransient();
      addBubble(`Connection error: ${err.message}`, 'error');
    }

    setInputEnabled(true);
  }

  // Auto-grow textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = '42px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Enter to send (Shift+Enter = newline)
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
</script>
</body>
</html>
